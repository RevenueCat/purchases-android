appId: com.revenuecat.e2etests
---
- launchApp:
    clearState: true
- tapOn: Customer Info
- assertVisible: "Active Subscriptions: None"
- assertVisible: "Entitlements: None"
- tapOn: Offerings
- tapOn: default
- tapOn: Show paywall
- extendedWaitUntil:
    visible: "Paywall V2"
    timeout: 15000
- tapOn: Yearly
- tapOn: Continue
- extendedWaitUntil:
    visible: "TEST VALID PURCHASE"
    timeout: 15000
- tapOn: TEST VALID PURCHASE
- tapOn: Customer Info
- tapOn: Refresh
- assertVisible: "pro: Active: true, Product: .*"
