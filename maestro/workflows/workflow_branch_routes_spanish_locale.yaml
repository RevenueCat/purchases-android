# Opens the `with-branch` offering with a Spanish locale and asserts Branch 1 routes to Testimonials 3
# instead of its fallback (Testimonials 1, see workflow_progresses_through_branch.yaml):
#   Welcome Screen 1 -> Branch 1 -> Testimonials 3
# The audience targets locale `es_es`. The app_locale launch argument is read in E2ETestsApplication and
# applied via Purchases.overridePreferredUILocale, which the SDK normalizes to lowercase snake case
# (`es-ES` -> `es_es`) before evaluating the audience.
#
# The Continue buttons are matched with a regex so the flow works whether or not the workflow has Spanish
# localizations for them ("Continue" / "Continuar").
#
# TODO: Testimonials 3 is asserted by its English headline. If the workflow gets Spanish localizations for
# that screen, replace it with the Spanish text.
# Run on CI by the `run-maestro-tests` job.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store maestro/workflows/workflow_branch_routes_spanish_locale.yaml

appId: com.revenuecat.e2etests
name: A workflow branch routes a Spanish locale to Testimonials 3
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- launchApp:
    clearState: true
    arguments:
      e2e_test_flow: open_workflow
      workflow_offering_identifier: "with-branch"
      app_locale: "es-ES"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000
- tapOn:
    text: "Present Paywall"

# Welcome screen 1, before the branch node.
- extendedWaitUntil:
    visible: "Continu(e|ar)"
    timeout: 15000
- takeScreenshot: "workflow_branch_routes_spanish_locale - welcome screen 1"
- tapOn:
    text: "Continu(e|ar)"

# Branch 1 -> Testimonials 3 for a Spanish locale.
- extendedWaitUntil:
    visible: "Cat whisperer in your pocket"
    timeout: 15000
- assertNotVisible: "(?s).*Over 1 million.*"
- takeScreenshot: "workflow_branch_routes_spanish_locale - testimonials 3"
