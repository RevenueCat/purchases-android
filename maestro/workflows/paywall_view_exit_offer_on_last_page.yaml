# Navigates the workflow (offering `default_workflows`) to its last page (the exit-offer step) and closes it.
# The workflow is hosted in a PaywallView with PaywallView.setExitOfferHandler, which swaps in a PaywallView for
# the exit offering the way the Unity SDK's Dialog-hosted presenter does. The exit paywall must be shown.
# The close control is an unlabeled icon tapped by coordinate (top-left), as in
# workflow_exit_offer_on_last_page.yaml.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store maestro/workflows/paywall_view_exit_offer_on_last_page.yaml

appId: com.revenuecat.e2etests
name: PaywallView exit offer is shown when closing the last page
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- launchApp:
    clearState: true
    arguments:
      e2e_test_flow: open_paywall_view_exit_offer
- extendedWaitUntil: { visible: "Present Paywall", timeout: 15000 }
- tapOn: { text: "Present Paywall" }
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: { text: "Continue 1/3" }
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: { text: "Continue 2/3" }
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better"
    timeout: 15000
# Close the last page (unlabeled close icon, top-left) -> the exit offer paywall replaces it.
- tapOn: { point: "8%,6%" }
- extendedWaitUntil:
    visible: "Unlock full access"
    timeout: 15000
- assertNotVisible: "Paywall dismissed"
- takeScreenshot: "paywall_view_exit_offer_on_last_page"
