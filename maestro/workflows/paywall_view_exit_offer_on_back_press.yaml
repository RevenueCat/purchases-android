# Pressing the system back button on the last workflow page must surface the exit offer, the same as tapping close.
# Hosted in a PaywallView with PaywallView.setExitOfferHandler, which re-targets that same PaywallView to the exit
# offering the way the Unity SDK's Dialog-hosted presenter does.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store maestro/workflows/paywall_view_exit_offer_on_back_press.yaml

appId: com.revenuecat.e2etests
name: PaywallView exit offer is shown when pressing back on the last page
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- launchApp:
    clearState: true
    arguments:
      e2e_test_flow: open_paywall_view_exit_offer
- extendedWaitUntil: { visible: "Present Paywall", timeout: 15000 }
- tapOn: { text: "Present Paywall" }
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: { text: "Continue 1/3" }
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: { text: "Continue 2/3" }
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better"
    timeout: 15000
# System back on the last page -> the same PaywallView shows the exit offer paywall.
- back
- extendedWaitUntil:
    visible: "Unlock full access"
    timeout: 15000
- assertNotVisible: "Paywall dismissed"
- takeScreenshot: "paywall_view_exit_offer_on_back_press"
