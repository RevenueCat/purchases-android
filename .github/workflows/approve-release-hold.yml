name: Approve release hold

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions: {}

jobs:
  approve:
    permissions:
      pull-requests: read
    uses: revenuecat/sdk-github-workflows/.github/workflows/approve-release-hold.yml@main # TODO pin to v9 once released
    secrets:
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
